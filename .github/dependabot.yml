version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*"]
      test:
        patterns: ["org.junit*", "org.mockito*", "org.assertj*", "org.testcontainers*", "org.pitest*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
