name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: verify / ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - common-lib
          - merchant-service
          - payment-service
          - vault-service
          - operations-service
          - api-gateway-service
          - discovery-service
          - config-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install common-lib
        if: matrix.module != 'common-lib'
        run: mvn -B -q -f common-lib/pom.xml -DskipTests install

      - name: Verify ${{ matrix.module }}
        run: mvn -B -f ${{ matrix.module }}/pom.xml verify

      - name: Layered coverage gate
        if: contains(fromJSON('["common-lib","merchant-service","payment-service","vault-service","operations-service","api-gateway-service"]'), matrix.module)
        run: python3 scripts/coverage-gate.py ${{ matrix.module }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/target/surefire-reports/
            ${{ matrix.module }}/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  manifests:
    name: kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render kustomization
        run: kubectl kustomize k8s > /tmp/rendered.yaml

      - name: Validate schemas
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered.yaml

      - name: Trivy misconfiguration scan
        run: |
          docker run --rm -v "$PWD:/src" aquasecurity/trivy:0.57.1 \
            config --severity CRITICAL --exit-code 1 /src/k8s

  images:
    name: image / ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module:
          - merchant-service
          - payment-service
          - vault-service
          - operations-service
          - api-gateway-service
          - config-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install common-lib
        run: mvn -B -q -f common-lib/pom.xml -DskipTests install

      - name: Build container image
        run: |
          mvn -B -q -f ${{ matrix.module }}/pom.xml -DskipTests -Djib.skip=false \
            jib:buildTar -Djib.to.image=neopay/${{ matrix.module }}:ci
          test -s ${{ matrix.module }}/target/jib-image.tar
          ls -lh ${{ matrix.module }}/target/jib-image.tar

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start infrastructure
        run: docker compose -p neopay_ci up -d --wait

      - name: Build services
        run: ./build-all.sh

      - name: Start services
        run: ./scripts/run-local.sh

      - name: Wait for the gateway
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "gateway healthy after ${i}0s"
              exit 0
            fi
            sleep 5
          done
          echo "gateway did not become healthy"
          exit 1

      - name: Run end-to-end flow
        run: ./scripts/e2e-full-flow.sh

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: .run/logs/
          retention-days: 3
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          ./scripts/stop-local.sh || true
          docker compose -p neopay_ci down -v || true

  gate-summary:
    name: gate summary
    runs-on: ubuntu-latest
    needs: [secrets, verify, manifests, images, e2e]
    if: always()
    steps:
      - name: Report matrix result
        run: |
          echo "secret scan: ${{ needs.secrets.result }}"
          echo "verify matrix: ${{ needs.verify.result }}"
          echo "manifests: ${{ needs.manifests.result }}"
          echo "image builds: ${{ needs.images.result }}"
          echo "end-to-end: ${{ needs.e2e.result }}"
          test "${{ needs.secrets.result }}" = "success"
          test "${{ needs.verify.result }}" = "success"
          test "${{ needs.manifests.result }}" = "success"
          test "${{ needs.images.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
