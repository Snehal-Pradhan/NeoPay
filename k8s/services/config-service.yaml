apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  namespace: neopay-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      labels:
        app: config-service
    spec:
      containers:
      - name: config-service
        image: neopay/neopay-config-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8888
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: GIT_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: GIT_USERNAME
        - name: GIT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: GIT_PASSWORD
        - name: GIT_CONFIG_REPO
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: GIT_CONFIG_REPO
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8888
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8888
          failureThreshold: 30
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8888
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: config-service
  namespace: neopay-core
spec:
  selector:
    app: config-service
  ports:
  - port: 8888
    targetPort: 8888
