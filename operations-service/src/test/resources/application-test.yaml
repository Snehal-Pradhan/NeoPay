spring:
  flyway:
    enabled: false
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:neopay-operations-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    listener:
      auto-startup: false
    bootstrap-servers: localhost:29092
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

MERCHANT_SERVICE_URI: http://localhost:9010
PAYMENT_SERVICE_URI: http://localhost:9020
